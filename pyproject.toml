[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "farm-core"
version = "0.1.0"
description = "Framework-independent farm foundation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
render = ["Pillow>=10.4,<13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
farm_core = ["data/*.json"]
farm_render = ["data/*.json", "data/*.zip", "data/*.md"]

[tool.ruff]
line-length = 80
target-version = "py310"
extend-exclude = ["legacy", ".agents", ".comet"]
