      truncated: false
  - id: A3
    source: brief.md
    text: "A3: 注册立即可查询 500 农场币、0 点券、0 经验、3 块空地； 重复注册不重复赠送；不同显式作用域不串号。"
    result: passed
    reason:
      text: 账户注册与初始500资产、三空地在事务内完成；重复注册及身份作用域隔离测试正式通过。
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: 购买到播种全过程扣款、入库、耗种和地块改变正确；0、负数、 布尔值、超大数量、余额/库存不足、等级不足和不存在对象明确失败，
      不留下部分写入。"
    result: passed
    reason:
      text: 购买和播种在完整事务内扣款、入库、耗种、存图；数量、等级、余额和空地边界测试正式通过。
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: 未成熟不能收获；成熟后只增加本次产量/经验；历史经验 100、 本次获得20时为120；多地加成逐块计算且交换顺序不改变总和；
      多季次数及枯萎/铲除遵守保存的规则与可注入时钟。"
    result: passed
    reason:
      text: 成熟边界、经验增量、多季再生长及枯萎清除源实现与规格一致，逐地块加成及顺序测试通过。
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: 出售收益只增加一次，例如余额100、收益20后为120； 锁定同时约束指定与全部出售；返回结构化真实余额及安全文本，
      不发生旧版模板参数缺失。"
    result: passed
    reason:
      text: 锁定状态对指定及全部出售生效，出售只增本次收入，Receipt和文本使用真实余额；正式测试通过。
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: 模拟交易中途异常时余额、库存、地块及流水整体回滚； 同一操作标识重试返回原结果、参数冲突拒绝；并发写入不超卖、
      不重复领取，不吞数据库故障伪装成功；重启后数据可读。"
    result: passed
    reason:
      text: BEGIN IMMEDIATE、操作指纹与结果同事务保存；异常回滚、并发超卖/重复收获、取消重放、重启与schema测试通过。
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: 提供可执行的离线测试、运行入口和使用说明，保留真实宿主、 真实库迁移及远程发布未验证的说明；文档记录已实现范围和剩余项。"
    result: passed
    reason:
      text: README、核心说明、离线入口与测试可用，准确说明尚无真实宿主、真实库迁移和远程发布验证。
      truncated: false
  - id: A9
    source: brief.md
    text: "A9: 独立图片工具支持透明合成、缩放、裁剪、文本测量/省略和三格式编码； 渲染不导入框架、不联网，核心保持无 Pillow
      依赖；安装包含所需素材。"
    result: passed
    reason:
      text: Pillow可选渲染模块支持透明合成、复制、缩放、裁剪、文字测量省略及三格式；核心无Pillow导入，wheel携带673素材并独立渲染通过。
      truncated: false
  - id: A10
    source: brief.md
    text: "A10: 从一次快照绘制空地、生长、成熟、再生长、枯萎及锁定地块， 使用统一时间、旧布局和正确偏移；输出普通/高清可解码图片。"
    result: passed
    reason:
      text: 纯场景转换消费一次快照和统一now，首季/再季锚点与枯萎优先正确；旧30块布局及真实offset字段已迁出，普通高清解码与阶段测试通过，样例已视觉检查。
      truncated: false
  - id: A11
    source: brief.md
    text: "A11: 小画布从开始按目标尺寸绘制；素材和结果缓存有内存上限， 共享素材不被污染；阶段/成熟边界、账户、头像及作用域变化不复用旧图。"
    result: passed
    reason:
      text: 目标尺寸直接合成；素材/底图与成图LRU有字节预算且返回副本；键含作用域、账户、阶段、头像、主题及编码配置，边界变化不复用旧图。
      truncated: false
  - id: A12
    source: brief.md
    text: "A12: 合成和编码在后台执行且限制并发，相同请求合并；取消和异常 不提前释放运行名额、不泄漏后台任务；记录耗时、尺寸和缓存状态。"
    result: passed
    reason:
      text: 整体合成编码由to_thread执行，semaphore限制并发、pending限制容量，shield维持取消后的任务容量并在关闭排空；合并、异常重试、事件循环和并发测试通过，日志不含用户标识。
      truncated: false
  - id: A13
    source: brief.md
    text: "A13: 离线生成农场样例、对比尺寸/编码与冷暖缓存，保存测量报告和 接入文档；验证旧基线及原有核心测试，明确尚未接入真实消息平台。"
    result: passed
    reason:
